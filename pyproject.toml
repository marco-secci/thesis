[project]
name = "thesis"
version = "0.1.0"
description = "Previsione del numero di donazioni di sangue — DIMT Trieste-Gorizia 2009-2025"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=17",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "lightgbm>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ipython>=8.26"]
docs = [
    "furo>=2025.12.19",
    "sphinx>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
